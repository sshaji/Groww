[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "groww-sip-lab"
version = "0.1.0"
description = "Read-only Groww integration and cash-constrained ETF SIP experiments"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
groww = ["growwapi>=1,<2"]

[project.scripts]
sip-lab = "sip_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["sip_lab*"]
